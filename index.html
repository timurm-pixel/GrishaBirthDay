<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрошення для Гришеньки</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fce4ec; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 450px; text-align: center; }
        h1 { color: #d81b60; font-size: 22px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #f8bbd0; border-radius: 12px; font-size: 16px; outline: none; }
        button { background-color: #ec407a; color: white; border: none; padding: 15px 25px; border-radius: 12px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; margin-top: 10px; }
        canvas { max-width: 100%; height: auto; margin-top: 20px; border-radius: 15px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #downloadBtn { background-color: #43a047; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎈 Отримай індивідуальне запрошення 🎈</h1>
    <input type="text" id="name1" placeholder="Ім'я першого гостя">
    <input type="text" id="name2" placeholder="Ім'я другого гостя (якщо є такий або така)">
    
    <button onclick="createInvite()">Створити та подивитись ✨</button>
    
    <canvas id="inviteCanvas"></canvas>
    
    <button id="downloadBtn" onclick="downloadImage()">⬇️ Зберегти та відправити гостю</button>
</div>

<script>
    function createInvite() {
        const n1 = document.getElementById('name1').value.trim();
        const n2 = document.getElementById('name2').value.trim();
        
        if (!n1) {
            alert("Будь ласка, введіть хоча б одне ім'я");
            return;
        }

        const canvas = document.getElementById('inviteCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();

        // Файл должен лежать в той же папке на GitHub под этим именем
        img.src = 'invite_bg.jpg'; 

        img.onload = function() {
            // Устанавливаем размер холста равным размеру картинки
            canvas.width = img.width;
            canvas.height = img.height;
            
            ctx.drawImage(img, 0, 0);
            
            // Настройка текста: цвет подбираем под коричневый на фото
            ctx.fillStyle = "#5a4632"; 
            // Шрифт 'Times New Roman' или 'Georgia' даст красивую засечку как на фото
            ctx.font = "italic 48px 'Georgia', serif"; 
            ctx.textAlign = "center";
            
            // Формируем текст
            let guestText = n2 ? `${n1} та ${n2}.` : `${n1}.`;
            
            // Рисуем текст. Координата 165 — это высота, подкорректируйте её, если нужно выше/ниже
            ctx.fillText(guestText, canvas.width / 2, 208);
            
            canvas.style.display = "block";
            document.getElementById('downloadBtn').style.display = "block";
            
            // Прокрутка вниз к готовому результату
            canvas.scrollIntoView({ behavior: 'smooth' });
        };
        
        img.onerror = function() {
            alert("Помилка: Не вдалося знайти файл 'invite_bg.jpg' у вашому GitHub. Завантажте фото в репозиторій!");
        };
    }

    function downloadImage() {
        const canvas = document.getElementById('inviteCanvas');
        const link = document.createElement('a');
        link.download = 'zaproshennya_na_1_rik.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
