<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Запрошення на 1 рочок</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 20px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; }
        button { background: #ff6bad; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        canvas { max-width: 100%; height: auto; margin-top: 20px; border-radius: 10px; display: none; }
        #downloadBtn { display: none; margin-top: 10px; background: #4caf50; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎈 Гришеньці 1 рік! 🎈</h1>
    <p>Введіть імена гостей:</p>
    <input type="text" id="name1" placeholder="Ім'я 1">
    <input type="text" id="name2" placeholder="Ім'я 2 (необов'язково)">
    <br>
    <button onclick="createInvite()">Створити запрошення</button>
    
    <canvas id="inviteCanvas"></canvas>
    <br>
    <button id="downloadBtn" onclick="downloadImage()">Зберегти як картинку</button>
</div>

<script>
    function createInvite() {
        const n1 = document.getElementById('name1').value;
        const n2 = document.getElementById('name2').value;
        if (!n1) return alert("Будь ласка, введіть ім'я");

        const canvas = document.getElementById('inviteCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();

        // Шлях до вашого фото в репозиторії
        img.src = 'invite_bg.jpg'; 

        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            
            // Малюємо фон
            ctx.drawImage(img, 0, 0);
            
            // Налаштування тексту
            ctx.fillStyle = "#5d4037"; // Колір тексту як на зразку
            ctx.font = "italic 45px 'Times New Roman'"; // Шрифт
            ctx.textAlign = "center";
            
            // Формуємо рядок імен
            const guestText = n2 ? `${n1} та ${n2}.` : `${n1}.`;
            
            // Малюємо імена (координати 540, 160 підібрані приблизно під верхню частину)
            ctx.fillText(guestText, canvas.width / 2, 165);
            
            canvas.style.display = "block";
            document.getElementById('downloadBtn').style.display = "inline-block";
        };
    }

    function downloadImage() {
        const canvas = document.getElementById('inviteCanvas');
        const link = document.createElement('a');
        link.download = 'invitation.png';
        link.href = canvas.toDataURL();
        link.click();
    }
</script>

</body>
</html>
