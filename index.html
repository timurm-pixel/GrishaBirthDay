<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на 1 годик</title>
    <style>
        /* Праздничный стиль */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            max-width: 450px; 
            width: 100%;
            text-align: center; 
        }
        h1 { color: #ff6bad; font-size: 28px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #888; font-size: 14px; margin-left: 10px; }
        
        input { 
            width: 100%; 
            padding: 12px 20px; 
            border: 2px solid #ffe4f1; 
            border-radius: 15px; 
            font-size: 16px; 
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #ff6bad; }
        
        button { 
            background: #ff6bad; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 15px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s, background 0.3s;
        }
        button:hover { background: #ff4d9a; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        #loading { display: none; margin-top: 20px; color: #ff6bad; font-weight: bold; }
        
        /* Стиль карточки приглашения */
        #invitationCard { 
            margin-top: 30px; 
            display: none; 
            padding: 25px; 
            border: 3px dashed #ff6bad; 
            border-radius: 20px; 
            background: #fffafa; 
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .invite-text { 
            font-size: 18px; 
            line-height: 1.6; 
            color: #444; 
            white-space: pre-wrap; /* Чтобы сохранялись переносы строк от нейросети */
        }
        .cake-icon { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="cake-icon">🎂</div>
    <h1>Первый день рождения!</h1>
    <p>Заполните форму, чтобы получить ваше персональное приглашение</p>
    
    <div class="form-group">
        <label>Имя первого гостя</label>
        <input type="text" id="name1" placeholder="Например, Мама">
    </div>
    
    <div class="form-group">
        <label>Имя второго гостя (если есть)</label>
        <input type="text" id="name2" placeholder="Например, Папа">
    </div>
    
    <button onclick="generateInvitation()">Получить приглашение ✨</button>
    
    <div id="loading">Gemini пишет приглашение... 📝</div>

    <div id="invitationCard">
        <div class="cake-icon">💌</div>
        <div id="inviteText" class="invite-text"></div>
    </div>
</div>

<script>
    async function generateInvitation() {
        const name1 = document.getElementById('name1').value;
        const name2 = document.getElementById('name2').value;
        const card = document.getElementById('invitationCard');
        const loading = document.getElementById('loading');
        const textElem = document.getElementById('inviteText');

        if (!name1) {
            alert("Пожалуйста, введите хотя бы одно имя.");
            return;
        }

        loading.style.display = "block";
        card.style.display = "none";

        // ВСТАВЬ СВОЙ КЛЮЧ ТУТ:
        const API_KEY = 'AIzaSyD1bM_OEjClU9Yl_2q7TG37Snlqv78ANmM'; 
        
        // Шаблон запроса (промпт)
        const guestNames = name2 ? `${name1} и ${name2}` : name1;
        const prompt = `Напиши короткое, доброе и праздничное приглашение на 1-й день рождения мальчика. 
        Имена гостей: ${guestNames}. 
        Тон: радостный, семейный. 
        В тексте упомяни, что это первый важный праздник в жизни малыша. 
        Не используй кавычки в начале и конце.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const generatedText = data.candidates[0].content.parts[0].text;
                textElem.innerText = generatedText;
                card.style.display = "block";
            } else {
                throw new Error("Empty response");
            }

        } catch (error) {
            console.error(error);
            textElem.innerText = `Дорогие ${guestNames}, приглашаем вас на наш первый день рождения! Будем очень рады вас видеть!`;
            card.style.display = "block";
        } finally {
            loading.style.display = "none";
        }
    }
</script>

</body>
</html>
